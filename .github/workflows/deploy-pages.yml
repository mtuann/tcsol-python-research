name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout frozen V1 archive
        uses: actions/checkout@v4
        with:
          ref: v1-tcsol-beginner
          path: v1-archive

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site _site/v1
          cd main
          for item in index.html README.md modules data_bank figure_gallery paper_package resources requirements.txt; do
            if [ -e "$item" ]; then
              cp -R "$item" ../_site/
            fi
          done
          cd ..
          for item in index.html README.md assets weeks resources; do
            if [ -e "v1-archive/$item" ]; then
              cp -R "v1-archive/$item" _site/v1/
            fi
          done
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
