<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 08: Error Priority Demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#172033;--muted:#5b6578;--line:#dbe4f0;--blue:#2563eb;--green:#1f7a4d;--amber:#b45309;--rose:#b8325f;--purple:#6d5bd0;--shadow:0 18px 44px rgba(23,32,51,.10)}*{box-sizing:border-box}body{background:linear-gradient(90deg,rgba(219,228,240,.45) 1px,transparent 1px),linear-gradient(0deg,rgba(219,228,240,.45) 1px,transparent 1px),var(--bg);background-size:40px 40px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0}.topbar{align-items:center;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;padding:.75rem clamp(1rem,4vw,3rem);position:sticky;top:0;z-index:10}.nav-links,.language-switcher{align-items:center;display:flex;flex-wrap:wrap;gap:.45rem}.nav-links a{border:1px solid var(--line);border-radius:8px;color:var(--ink);font-weight:780;padding:.4rem .65rem;text-decoration:none}.nav-links a.primary{background:var(--blue);border-color:var(--blue);color:#fff}main{margin:0 auto;max-width:1180px;padding:clamp(1rem,3vw,2rem)}.hero{display:grid;gap:.85rem;margin-bottom:1rem;max-width:880px}.tag{background:var(--paper);border:1px solid var(--line);border-radius:999px;color:var(--blue);display:inline-flex;font-size:.82rem;font-weight:850;letter-spacing:.05em;padding:.35rem .65rem;text-transform:uppercase;width:max-content}h1{font-size:clamp(2rem,5vw,4.2rem);line-height:1;margin:0}p{color:var(--muted);font-size:1.05rem;line-height:1.55;margin:0}.workspace{display:grid;gap:1rem;grid-template-columns:minmax(300px,.85fr) minmax(0,1.15fr)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:1rem}.controls{display:grid;gap:1rem}.mode-row{display:grid;gap:.45rem;grid-template-columns:repeat(2,minmax(0,1fr))}.mode-row button{background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;font:inherit;font-weight:800;min-height:42px;padding:.55rem}.mode-row button.active{background:var(--blue);border-color:var(--blue);color:#fff}label{color:var(--ink);display:grid;font-weight:800;gap:.45rem}input[type=range]{accent-color:var(--blue);width:100%}.value-row{align-items:center;display:flex;gap:.5rem;justify-content:space-between}.value-pill{background:#edf4ff;border:1px solid #cfe1ff;border-radius:8px;color:var(--blue);font-weight:850;padding:.3rem .5rem}.stats-grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:1rem}.stat{border:1px solid var(--line);border-radius:8px;padding:.8rem}.stat strong{display:block;font-size:1.25rem;line-height:1.1;margin-bottom:.25rem;overflow-wrap:anywhere}.stat span{color:var(--muted);font-size:.86rem}.bar-viz{display:grid;gap:.8rem}.bar-row{display:grid;gap:.35rem}.bar-label{font-weight:850}.bar-track{background:#edf4ff;border-radius:8px;height:2rem;overflow:hidden;position:relative}.bar-fill{border-radius:8px;height:100%;transition:width .18s ease}.bar-score{color:var(--ink);font-weight:850;position:absolute;right:.6rem;top:50%;transform:translateY(-50%)}.writing-box{border-left:6px solid var(--green);margin-top:1rem}.writing-box strong{display:block;margin-bottom:.4rem}.noscript-note{border-left:6px solid var(--amber);margin:0 auto 1rem;max-width:1180px}@media(max-width:900px){.topbar{align-items:flex-start;flex-direction:column}.workspace{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.mode-row,.stats-grid{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần 08</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><noscript><div class="panel noscript-note">Trang này hiển thị ví dụ mặc định. Bật JavaScript để đổi error category và severity.</div></noscript><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">Error priority explorer</h1><p data-i18n="hero.body">Chọn error category, kéo frequency/severity và xem teaching priority sentence thay đổi.</p></section><section class="workspace"><aside class="panel controls"><div><p data-i18n="mode.title">Chọn error category</p><div class="mode-row"><button type="button" data-mode="word_order" data-i18n="mode.word" aria-pressed="false">Word order</button><button type="button" data-mode="measure_word" data-i18n="mode.measure" aria-pressed="false">Measure word</button><button type="button" class="active" data-mode="tone_marking" data-i18n="mode.tone" aria-pressed="true">Tone marking</button><button type="button" data-mode="result_complement" data-i18n="mode.result" aria-pressed="false">Result comp.</button><button type="button" data-mode="aspect_marker" data-i18n="mode.aspect" aria-pressed="false">Aspect marker</button></div></div><label><span class="value-row"><span data-i18n="control.frequency">Frequency</span><span class="value-pill" id="frequencyValue">13</span></span><input id="frequencySlider" type="range" min="1" max="25" step="1" value="13"></label><label><span class="value-row"><span data-i18n="control.severity">Mean severity</span><span class="value-pill" id="severityValue">1.85</span></span><input id="severitySlider" type="range" min="1" max="3" step="0.05" value="1.85"></label></aside><section class="panel"><div class="stats-grid" aria-live="polite"><div class="stat"><strong id="categoryStat">tone_marking</strong><span data-i18n="stat.category">Category</span></div><div class="stat"><strong id="targetStat">1</strong><span data-i18n="stat.targets">Targets</span></div><div class="stat"><strong id="priorityStat">24.0</strong><span data-i18n="stat.priority">Priority</span></div><div class="stat"><strong id="claimStat">Hypothesis</strong><span data-i18n="stat.claim">Claim type</span></div></div><div class="bar-viz" id="viz" aria-label="Priority visualization" data-i18n-aria-label="viz.aria"></div><div class="panel writing-box"><strong data-i18n="writing.title">Results + teaching sentence</strong><p id="sentence" aria-live="polite"></p></div></section></section></main><script src="../../assets/js/bilingual.js"></script><script>
const DEMO_I18N={vi:{"meta.title":"Tuần 08: Error Priority Demo","nav.aria":"Điều hướng khóa học","nav.home":"Trang chủ","nav.week":"Tuần 08","nav.slides":"Slides","nav.notebook":"Notebook","nav.language":"Ngôn ngữ / Language","hero.tag":"Demo tương tác","hero.title":"Error priority explorer","hero.body":"Chọn error category, kéo frequency/severity và xem teaching priority sentence thay đổi.","mode.title":"Chọn error category","mode.word":"Word order","mode.measure":"Measure word","mode.tone":"Tone marking","mode.result":"Result comp.","mode.aspect":"Aspect marker","control.frequency":"Frequency","control.severity":"Mean severity","stat.category":"Category","stat.targets":"Targets","stat.priority":"Priority","stat.claim":"Claim type","claim.hypothesis":"Hypothesis","viz.aria":"Minh họa teaching priority","writing.title":"Results + teaching sentence","sentence.word_order":"word_order xuất hiện ở nhiều target structures, nên follow-up lesson nên dùng sentence frames và guided correction. Possible Vietnamese transfer chỉ là hypothesis.","sentence.measure_word":"measure_word cần được dạy lại bằng noun-classifier chunks như yi bei cha và liang ben shu; không nên kết luận từ một example.","sentence.tone_marking":"tone_marking cần minimal pairs và tone-mark check; lỗi tone có thể do nhiều nguyên nhân, không chỉ L1 transfer.","sentence.result_complement":"result_complement cần contrast action vs result, ví dụ zhao vs zhaodao; claim giữ ở mức descriptive.","sentence.aspect_marker":"aspect_marker cần so sánh action completed và sentence-final 了; không coi 了 là tense marker trực tiếp.","sentence.current":"Current priority = {n} x {severity} = {priority}."},en:{"meta.title":"Week 08: Error Priority Demo","nav.aria":"Course navigation","nav.home":"Home","nav.week":"Week 08","nav.slides":"Slides","nav.notebook":"Notebook","nav.language":"Language","hero.tag":"Interactive demo","hero.title":"Error priority explorer","hero.body":"Choose an error category, move frequency/severity, and watch the teaching priority sentence change.","mode.title":"Choose error category","mode.word":"Word order","mode.measure":"Measure word","mode.tone":"Tone marking","mode.result":"Result comp.","mode.aspect":"Aspect marker","control.frequency":"Frequency","control.severity":"Mean severity","stat.category":"Category","stat.targets":"Targets","stat.priority":"Priority","stat.claim":"Claim type","claim.hypothesis":"Hypothesis","viz.aria":"Teaching priority visualization","writing.title":"Results + teaching sentence","sentence.word_order":"word_order appears across multiple target structures, so the follow-up lesson should use sentence frames and guided correction. Possible Vietnamese transfer is only a hypothesis.","sentence.measure_word":"measure_word should be retaught through noun-classifier chunks such as yi bei cha and liang ben shu; do not generalize from one example.","sentence.tone_marking":"tone_marking needs minimal pairs and tone-mark checks; tone errors can have multiple causes, not only L1 transfer.","sentence.result_complement":"result_complement needs action-vs-result contrasts, such as zhao vs zhaodao; keep the claim descriptive.","sentence.aspect_marker":"aspect_marker needs comparison between completed action and sentence-final 了; do not treat 了 as a direct tense marker.","sentence.current":"Current priority = {n} x {severity} = {priority}."}};
window.Bilingual.init({translations:DEMO_I18N,defaultLang:"vi"});
const categoryData={tone_marking:{targets:1,color:"#b45309",frequency:13,severity:1.85},measure_word:{targets:1,color:"#1f7a4d",frequency:11,severity:2.18},result_complement:{targets:1,color:"#b8325f",frequency:11,severity:1.91},word_order:{targets:1,color:"#2563eb",frequency:11,severity:1.91},aspect_marker:{targets:1,color:"#6d5bd0",frequency:11,severity:1.82}};const freq=document.querySelector('#frequencySlider'),sev=document.querySelector('#severitySlider'),freqVal=document.querySelector('#frequencyValue'),sevVal=document.querySelector('#severityValue'),categoryStat=document.querySelector('#categoryStat'),targetStat=document.querySelector('#targetStat'),priorityStat=document.querySelector('#priorityStat'),claimStat=document.querySelector('#claimStat'),viz=document.querySelector('#viz'),sentence=document.querySelector('#sentence'),buttons=Array.from(document.querySelectorAll('[data-mode]'));let mode='tone_marking';function t(k){const lang=window.Bilingual.getLang?window.Bilingual.getLang():'vi';return DEMO_I18N[lang][k]||DEMO_I18N.vi[k]||k}function setMode(next){mode=next;const item=categoryData[mode];freq.value=item.frequency;sev.value=item.severity;buttons.forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});update()}function update(){const item=categoryData[mode];const f=Number(freq.value),s=Number(sev.value),priority=(f*s).toFixed(1),sentenceNow=t('sentence.current').replace('{n}',f).replace('{severity}',s.toFixed(2)).replace('{priority}',priority);freqVal.textContent=f;sevVal.textContent=s.toFixed(2);categoryStat.textContent=mode;targetStat.textContent=item.targets;priorityStat.textContent=priority;claimStat.textContent=t('claim.hypothesis');sentence.textContent=t('sentence.'+mode)+' '+sentenceNow;const rows=[[mode,f,item.color],[t('control.severity'),Math.round(s/3*25), '#6d5bd0']];viz.innerHTML=rows.map(([label,value,color])=>`<div class="bar-row"><div class="bar-label">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,value*4)}%;background:${color}"></div><span class="bar-score">${value}</span></div></div>`).join('')}buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));[freq,sev].forEach(input=>input.addEventListener('input',update));document.addEventListener('bilingual:change',update);update();</script></body></html>
