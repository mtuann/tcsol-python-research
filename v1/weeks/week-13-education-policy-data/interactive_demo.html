<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 13: Policy coding demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><link rel="stylesheet" href="../../assets/css/course-doc.css?v=20260604a"><style>body{background:#f6f8fc;color:#172033}main{max-width:1120px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2rem)}.topbar{align-items:center;background:#fff;border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}.nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}.nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}.nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.35rem 0}.tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}.panel{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}.workspace{display:grid;gap:1rem;grid-template-columns:300px minmax(0,1fr)}.bar-row{display:grid;gap:.5rem;grid-template-columns:minmax(150px,260px) 1fr minmax(42px,max-content);align-items:center;margin:.55rem 0}.bar{background:#eef4ff;border-radius:999px;height:1.35rem;overflow:hidden}.bar i{background:#1f7a4d;display:block;height:100%}.summary{border-left:7px solid #b8325f;background:#fff;border-radius:8px;margin-top:1rem;padding:1rem}@media(max-width:820px){.workspace{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;position:static}.bar-row{grid-template-columns:1fr}}</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">Đọc coding table</h1><p data-i18n="hero.body">Chọn view để xem policy_area, source_type hoặc evidence_type.</p></section><section class="workspace"><aside class="panel"><div class="mode-row"><button type="button" class="active" data-mode="policy" data-i18n="mode.policy">Policy area</button><button type="button" class="" data-mode="source" data-i18n="mode.source">Source type</button><button type="button" class="" data-mode="evidence" data-i18n="mode.evidence">Evidence type</button></div></aside><div class="panel"><div id="bars" role="list" aria-label="Danh sách kết quả" data-i18n-aria-label="bars.aria"></div><div class="summary"><h2 data-i18n="summary.title">Gợi ý diễn giải</h2><p id="guide"></p></div></div></section></main><script src="../../assets/js/bilingual.js"></script><script>const I18N={"vi": {"meta.title": "Tuần 13: Policy coding demo", "nav.aria": "Điều hướng khóa học", "nav.home": "Trang chủ", "nav.week": "Tuần 13", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Ngôn ngữ / Language", "hero.tag": "Demo tương tác", "hero.title": "Đọc coding table", "hero.body": "Chọn view để xem policy_area, source_type hoặc evidence_type.", "summary.title": "Gợi ý diễn giải", "bars.aria": "Danh sách kết quả", "mode.policy": "Policy area", "mode.source": "Source type", "mode.evidence": "Evidence type"}, "en": {"meta.title": "Week 13: Policy coding demo", "nav.aria": "Course navigation", "nav.home": "Home", "nav.week": "Week 13", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Language", "hero.tag": "Interactive demo", "hero.title": "Read a coding table", "hero.body": "Choose a view to inspect policy_area, source_type, or evidence_type.", "summary.title": "Interpretation guide", "bars.aria": "Result list", "mode.policy": "Policy area", "mode.source": "Source type", "mode.evidence": "Evidence type"}}; const DATA={"policy": {"rows": [["teacher_development", 2], ["indicator_metadata", 2], ["policy_coding_method", 2], ["system_governance", 1], ["digitalization", 1], ["internationalization", 1], ["education_statistics", 1], ["equity_access", 1], ["comparative_policy", 1]], "guide": {"vi": "Các count mô tả sample classroom nhỏ, không chứng minh policy impact.", "en": "The counts describe a small classroom sample; they do not prove policy impact."}}, "source": {"rows": [["policy_plan", 4], ["statistical_bulletin", 3], ["metadata_standard", 1], ["data_portal", 1], ["coding_model", 1], ["policy_dashboard", 1], ["comparative_report", 1]], "guide": {"vi": "Source type giúp viết limitation vì mỗi loại nguồn hỗ trợ claim khác nhau.", "en": "Source type supports the limitation because each source type supports a different kind of claim."}}, "evidence": {"rows": [["policy_text", 3], ["statistical_indicator", 3], ["metadata", 2], ["method_model", 2], ["milestone", 1], ["report", 1]], "guide": {"vi": "Evidence type không nên bị trộn như cùng một loại bằng chứng.", "en": "Evidence types should not be mixed as if they were the same kind of proof."}}}; let mode='policy'; function render(){const lang=window.Bilingual?window.Bilingual.getLang():'vi'; const pack=DATA[mode]; const rows=pack.rows; const max=Math.max(...rows.map(r=>r[1])); document.getElementById('bars').innerHTML=rows.map(([label,count])=>`<div class="bar-row" role="listitem" aria-label="${label}: ${count}"><strong>${label}</strong><div class="bar"><i style="width:${Math.max(8,count/max*100)}%"></i></div><span>${count}</span></div>`).join(''); document.getElementById('guide').textContent=pack.guide[lang];} document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode; document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn)); render();})); window.Bilingual.init({translations:I18N,defaultLang:'vi',onChange:render}); render();</script></body></html>
