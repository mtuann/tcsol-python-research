<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">Tuần 06: CI Explorer</title>
  <link rel="stylesheet" href="../../assets/css/bilingual.css">
  <style>
    :root {
      --bg: #f5f7fb;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #5b6578;
      --line: #dbe4f0;
      --blue: #2563eb;
      --green: #1f7a4d;
      --amber: #b45309;
      --rose: #b8325f;
      --shadow: 0 18px 44px rgba(23, 32, 51, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      background:
        linear-gradient(90deg, rgba(219, 228, 240, 0.45) 1px, transparent 1px),
        linear-gradient(0deg, rgba(219, 228, 240, 0.45) 1px, transparent 1px),
        var(--bg);
      background-size: 40px 40px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
    }
    .topbar {
      align-items: center;
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      padding: 0.75rem clamp(1rem, 4vw, 3rem);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-links,
    .language-switcher {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .nav-links a {
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-weight: 780;
      padding: 0.4rem 0.65rem;
      text-decoration: none;
    }
    .nav-links a.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    main {
      margin: 0 auto;
      max-width: 1180px;
      padding: clamp(1rem, 3vw, 2rem);
    }
    .hero {
      display: grid;
      gap: 0.85rem;
      margin-bottom: 1rem;
      max-width: 820px;
    }
    .tag {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--blue);
      display: inline-flex;
      font-size: 0.82rem;
      font-weight: 850;
      letter-spacing: 0.05em;
      padding: 0.35rem 0.65rem;
      text-transform: uppercase;
      width: max-content;
    }
    h1 {
      font-size: clamp(2.4rem, 6vw, 5.2rem);
      letter-spacing: 0;
      line-height: 1;
      margin: 0;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      margin: 0;
    }
    .workspace {
      display: grid;
      gap: 1rem;
      grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.15fr);
    }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 1rem;
    }
    .controls {
      display: grid;
      gap: 1rem;
    }
    label {
      color: var(--ink);
      display: grid;
      font-weight: 800;
      gap: 0.45rem;
    }
    input[type="range"] {
      accent-color: var(--blue);
      width: 100%;
    }
    .value-row {
      align-items: center;
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
    }
    .value-pill {
      background: #edf4ff;
      border: 1px solid #cfe1ff;
      border-radius: 8px;
      color: var(--blue);
      font-weight: 850;
      padding: 0.3rem 0.5rem;
    }
    .mode-row {
      display: grid;
      gap: 0.45rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .mode-row button {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      min-height: 42px;
      padding: 0.55rem;
    }
    .mode-row button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .stats-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 1rem;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.8rem;
    }
    .stat strong {
      display: block;
      font-size: 1.45rem;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .stat span {
      color: var(--muted);
      font-size: 0.86rem;
    }
    .viz {
      min-height: 320px;
    }
    svg {
      display: block;
      height: auto;
      width: 100%;
    }
    .writing-box {
      border-left: 6px solid var(--green);
      margin-top: 1rem;
    }
    .writing-box strong {
      display: block;
      margin-bottom: 0.4rem;
    }
    @media (max-width: 900px) {
      .workspace,
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria">
      <a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a>
      <a href="./" data-i18n="nav.week">Tuần 06</a>
      <a href="slides.html" data-i18n="nav.slides">Slides</a>
    </nav>
    <div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language">
      <button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button>
      <button type="button" data-lang-option="en" aria-pressed="false">English</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <span class="tag" data-i18n="hero.tag">Demo tương tác</span>
      <h1 data-i18n="hero.title">CI Explorer</h1>
      <p data-i18n="hero.body">Kéo sample size và variation để thấy confidence interval rộng/hẹp ra sao. Mục tiêu là hiểu uncertainty trước khi viết Results.</p>
    </section>

    <section class="workspace">
      <aside class="panel controls">
        <label>
          <span class="value-row"><span data-i18n="control.n">Usable N</span><span class="value-pill" id="nValue">25</span></span>
          <input id="nSlider" type="range" min="5" max="60" step="1" value="25">
        </label>
        <label>
          <span class="value-row"><span data-i18n="control.mean">Mean gain</span><span class="value-pill" id="meanValue">10.88</span></span>
          <input id="meanSlider" type="range" min="2" max="16" step="0.1" value="10.88">
        </label>
        <label>
          <span class="value-row"><span data-i18n="control.sd">SD: learner spread</span><span class="value-pill" id="sdValue">1.90</span></span>
          <input id="sdSlider" type="range" min="0.4" max="6" step="0.1" value="1.90">
        </label>
        <div>
          <p data-i18n="mode.title">Chọn ví dụ chuyển đổi</p>
          <div class="mode-row">
            <button type="button" class="active" data-mode="tcsol" data-i18n="mode.tcsol">TCSOL</button>
            <button type="button" data-mode="contrast" data-i18n="mode.contrast">Hán-Việt</button>
            <button type="button" data-mode="mtpe" data-i18n="mode.mtpe">MTPE</button>
            <button type="button" data-mode="policy" data-i18n="mode.policy">Policy</button>
          </div>
        </div>
      </aside>

      <section class="panel">
        <div class="stats-grid">
          <div class="stat"><strong id="meanStat">10.88</strong><span data-i18n="stat.mean">Mean</span></div>
          <div class="stat"><strong id="sdStat">1.90</strong><span data-i18n="stat.sd">SD</span></div>
          <div class="stat"><strong id="seStat">0.38</strong><span data-i18n="stat.se">SE</span></div>
          <div class="stat"><strong id="ciStat">[10.10, 11.66]</strong><span data-i18n="stat.ci">95% CI</span></div>
        </div>
        <div class="viz" id="viz" aria-label="Confidence interval visualization" data-i18n-aria-label="viz.aria"></div>
        <div class="panel writing-box">
          <strong data-i18n="writing.title">Results sentence</strong>
          <p id="sentence"></p>
        </div>
      </section>
    </section>
  </main>

  <script src="../../assets/js/bilingual.js"></script>
  <script>
    const DEMO_I18N = {
      vi: {
        "meta.title": "Tuần 06: CI Explorer",
        "nav.aria": "Điều hướng khóa học",
        "nav.home": "Trang chủ",
        "nav.week": "Tuần 06",
        "nav.slides": "Slides",
        "nav.language": "Ngôn ngữ / Language",
        "hero.tag": "Demo tương tác",
        "hero.title": "CI Explorer",
        "hero.body": "Kéo sample size và variation để thấy confidence interval rộng/hẹp ra sao. Mục tiêu là hiểu uncertainty trước khi viết Results.",
        "control.n": "Usable N",
        "control.mean": "Mean gain",
        "control.sd": "SD: learner spread",
        "mode.title": "Chọn ví dụ chuyển đổi",
        "mode.tcsol": "TCSOL",
        "mode.contrast": "Hán-Việt",
        "mode.mtpe": "MTPE",
        "mode.policy": "Policy",
        "stat.mean": "Mean",
        "stat.sd": "SD",
        "stat.se": "SE",
        "stat.ci": "95% CI",
        "viz.aria": "Minh họa confidence interval",
        "writing.title": "Results sentence",
        "axis.low": "low",
        "axis.high": "high",
        "axis.mean": "mean",
        "track.tcsol": "In the usable TCSOL records (N = {n}), learners gained an average of {mean} points (SD = {sd}, 95% CI [{low}, {high}]). This is descriptive evidence, not a causal claim.",
        "track.contrast": "For the contrastive feature sample (N = {n}), the mean difficulty rating was {mean} (SD = {sd}, 95% CI [{low}, {high}]). The estimate should be read as a teaching-priority signal.",
        "track.mtpe": "For the MTPE sample (N = {n}), the mean post-editing effort was {mean} units (SD = {sd}, 95% CI [{low}, {high}]). The interval shows uncertainty around the estimate.",
        "track.policy": "For the policy text sample (N = {n}), the mean coding score was {mean} (SD = {sd}, 95% CI [{low}, {high}]). The claim should stay tied to the coded documents."
      },
      en: {
        "meta.title": "Week 06: CI Explorer",
        "nav.aria": "Course navigation",
        "nav.home": "Home",
        "nav.week": "Week 06",
        "nav.slides": "Slides",
        "nav.language": "Language",
        "hero.tag": "Interactive demo",
        "hero.title": "CI Explorer",
        "hero.body": "Move sample size and variation to see how confidence intervals widen or narrow. The goal is to understand uncertainty before writing Results.",
        "control.n": "Usable N",
        "control.mean": "Mean gain",
        "control.sd": "SD: learner spread",
        "mode.title": "Choose a transfer example",
        "mode.tcsol": "TCSOL",
        "mode.contrast": "Chinese-Vietnamese",
        "mode.mtpe": "MTPE",
        "mode.policy": "Policy",
        "stat.mean": "Mean",
        "stat.sd": "SD",
        "stat.se": "SE",
        "stat.ci": "95% CI",
        "viz.aria": "Confidence interval visualization",
        "writing.title": "Results sentence",
        "axis.low": "low",
        "axis.high": "high",
        "axis.mean": "mean",
        "track.tcsol": "In the usable TCSOL records (N = {n}), learners gained an average of {mean} points (SD = {sd}, 95% CI [{low}, {high}]). This is descriptive evidence, not a causal claim.",
        "track.contrast": "For the contrastive feature sample (N = {n}), the mean difficulty rating was {mean} (SD = {sd}, 95% CI [{low}, {high}]). The estimate should be read as a teaching-priority signal.",
        "track.mtpe": "For the MTPE sample (N = {n}), the mean post-editing effort was {mean} units (SD = {sd}, 95% CI [{low}, {high}]). The interval shows uncertainty around the estimate.",
        "track.policy": "For the policy text sample (N = {n}), the mean coding score was {mean} (SD = {sd}, 95% CI [{low}, {high}]). The claim should stay tied to the coded documents."
      }
    };

    window.Bilingual.init({ translations: DEMO_I18N, defaultLang: "vi" });

    const nSlider = document.querySelector("#nSlider");
    const meanSlider = document.querySelector("#meanSlider");
    const sdSlider = document.querySelector("#sdSlider");
    const nValue = document.querySelector("#nValue");
    const meanValue = document.querySelector("#meanValue");
    const sdValue = document.querySelector("#sdValue");
    const meanStat = document.querySelector("#meanStat");
    const sdStat = document.querySelector("#sdStat");
    const seStat = document.querySelector("#seStat");
    const ciStat = document.querySelector("#ciStat");
    const viz = document.querySelector("#viz");
    const sentence = document.querySelector("#sentence");
    const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));
    let mode = "tcsol";

    function t(key) {
      const lang = window.Bilingual.getLang ? window.Bilingual.getLang() : "vi";
      return DEMO_I18N[lang][key] || DEMO_I18N.vi[key] || key;
    }

    function tCritical(n) {
      const table = {4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,11:2.201,12:2.179,13:2.160,14:2.145,15:2.131,16:2.120,17:2.110,18:2.101,19:2.093,20:2.086,21:2.080,22:2.074,23:2.069,24:2.064,25:2.060,26:2.056,27:2.052,28:2.048,29:2.045,30:2.042};
      const df = Math.max(1, n - 1);
      return table[df] || 1.96;
    }

    function fmt(value) {
      return Number(value).toFixed(2);
    }

    function sentenceText(values) {
      return t("track." + mode)
        .replace("{n}", values.n)
        .replace("{mean}", fmt(values.mean))
        .replace("{sd}", fmt(values.sd))
        .replace("{low}", fmt(values.low))
        .replace("{high}", fmt(values.high));
    }

    function renderSvg(values) {
      const width = 760;
      const height = 300;
      const left = 80;
      const right = 690;
      const y = 145;
      const min = Math.max(0, Math.floor(values.low - values.sd));
      const max = Math.ceil(values.high + values.sd);
      const scale = (x) => left + ((x - min) / (max - min)) * (right - left);
      const lowX = scale(values.low);
      const highX = scale(values.high);
      const meanX = scale(values.mean);
      viz.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${t("viz.aria")}">
          <rect x="0" y="0" width="${width}" height="${height}" fill="#ffffff" rx="8"></rect>
          <line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#dbe4f0" stroke-width="4" stroke-linecap="round"></line>
          <line x1="${lowX}" y1="${y}" x2="${highX}" y2="${y}" stroke="#2563eb" stroke-width="10" stroke-linecap="round"></line>
          <circle cx="${meanX}" cy="${y}" r="16" fill="#1f7a4d"></circle>
          <line x1="${lowX}" y1="${y-34}" x2="${lowX}" y2="${y+34}" stroke="#172033" stroke-width="3"></line>
          <line x1="${highX}" y1="${y-34}" x2="${highX}" y2="${y+34}" stroke="#172033" stroke-width="3"></line>
          <text x="${lowX}" y="${y+62}" text-anchor="middle" fill="#5b6578" font-size="16" font-weight="700">${t("axis.low")} ${fmt(values.low)}</text>
          <text x="${meanX}" y="${y-28}" text-anchor="middle" fill="#1f7a4d" font-size="18" font-weight="850">${t("axis.mean")} ${fmt(values.mean)}</text>
          <text x="${highX}" y="${y+62}" text-anchor="middle" fill="#5b6578" font-size="16" font-weight="700">${t("axis.high")} ${fmt(values.high)}</text>
          <text x="${left}" y="245" fill="#5b6578" font-size="15">N=${values.n}; SE=${fmt(values.se)}; t=${fmt(values.tcrit)}</text>
        </svg>
      `;
    }

    function update() {
      const n = Number(nSlider.value);
      const mean = Number(meanSlider.value);
      const sd = Number(sdSlider.value);
      const se = sd / Math.sqrt(n);
      const tcrit = tCritical(n);
      const low = mean - tcrit * se;
      const high = mean + tcrit * se;
      const values = { n, mean, sd, se, tcrit, low, high };
      nValue.textContent = n;
      meanValue.textContent = fmt(mean);
      sdValue.textContent = fmt(sd);
      meanStat.textContent = fmt(mean);
      sdStat.textContent = fmt(sd);
      seStat.textContent = fmt(se);
      ciStat.textContent = `[${fmt(low)}, ${fmt(high)}]`;
      renderSvg(values);
      sentence.textContent = sentenceText(values);
    }

    [nSlider, meanSlider, sdSlider].forEach((slider) => slider.addEventListener("input", update));
    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        modeButtons.forEach((item) => item.classList.toggle("active", item === button));
        update();
      });
    });
    document.addEventListener("bilingual:change", update);
    update();
  </script>
</body>
</html>
