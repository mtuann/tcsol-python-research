<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 09: Contrastive Risk Demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><link rel="stylesheet" href="../../assets/css/course-doc.css"><style>body{background:#f6f8fc;color:#172033}main{max-width:1180px;margin:0 auto;padding:2rem clamp(1rem,3vw,2rem)}.topbar{align-items:center;background:rgba(255,255,255,.94);border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}.nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}.nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}.nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}.hero h1{font-size:clamp(2.4rem,7vw,5rem);letter-spacing:0;line-height:1;margin:.4rem 0}.tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}.workspace{display:grid;gap:1rem;grid-template-columns:320px minmax(0,1fr)}.panel,.example-card div,.writing-box{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}label{display:block;font-weight:800;margin-top:1rem}input[type=range]{width:100%}.value-row{display:flex;justify-content:space-between;gap:1rem}.value-pill{background:#eef4ff;border:1px solid #cfe1ff;border-radius:999px;color:#1d4ed8;padding:.1rem .55rem}.stats-grid,.example-card{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:1rem}.example-card{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:7px solid #2f63ea;background:#f8fbff;border-radius:8px;padding:.9rem;overflow-wrap:anywhere}.stat strong{display:block;font-size:clamp(1.4rem,3vw,2.2rem)}.bar-row{display:grid;gap:.6rem;grid-template-columns:180px minmax(0,1fr);margin:.8rem 0}.bar-track{background:#eef4ff;border-radius:999px;position:relative;min-height:2rem;overflow:hidden}.bar-fill{display:block;height:100%;border-radius:999px}.bar-score{position:absolute;right:.75rem;top:.28rem;font-weight:900}@media(max-width:820px){.workspace,.stats-grid,.example-card{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;gap:.7rem}}</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần 09</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">Contrastive risk explorer</h1><p data-i18n="hero.body">Chọn hiện tượng đối chiếu, chỉnh count/risk và xem analysis sentence thay đổi.</p></section><section class="workspace"><aside class="panel"><p data-i18n="mode.title">Chọn phenomenon</p><div class="mode-row"><button type="button" data-mode="result_complement">result_complement</button><button type="button" data-mode="aspect_marker">aspect_marker</button><button type="button" data-mode="sino_vietnamese_lexical">sino_vietnamese_lexical</button><button type="button" data-mode="tone_pinyin_mapping">tone_pinyin_mapping</button><button type="button" data-mode="time_place_order">time_place_order</button><button type="button" data-mode="measure_classifier">measure_classifier</button></div><label><span class="value-row"><span data-i18n="control.count">Example count</span><span class="value-pill" id="countValue"></span></span><input id="countSlider" type="range" min="1" max="16" step="1"></label><label><span class="value-row"><span data-i18n="control.risk">Mean risk</span><span class="value-pill" id="riskValue"></span></span><input id="riskSlider" type="range" min="1" max="3" step="0.05"></label></aside><section class="panel"><div class="stats-grid"><div class="stat"><strong id="categoryStat"></strong><span data-i18n="stat.category">Phenomenon</span></div><div class="stat"><strong id="highStat"></strong><span data-i18n="stat.high">High-risk examples</span></div><div class="stat"><strong id="priorityStat"></strong><span data-i18n="stat.priority">Priority</span></div></div><div class="example-card"><div><b>中文</b><span id="zhExample"></span></div><div><b>Tiếng Việt</b><span id="viExample"></span></div></div><div id="viz" aria-label="Priority visualization" data-i18n-aria-label="viz.aria"></div><div class="writing-box"><strong data-i18n="writing.title">Analysis sentence</strong><p id="sentence"></p></div></section></section></main><script src="../../assets/js/bilingual.js"></script><script>const DEMO_I18N={"vi":{"meta.title":"Tuần 09: Contrastive Risk Demo","nav.aria":"Điều hướng khóa học","nav.home":"Trang chủ","nav.week":"Tuần 09","nav.slides":"Slides","nav.notebook":"Notebook","nav.language":"Ngôn ngữ / Language","hero.tag":"Demo tương tác","hero.title":"Contrastive risk explorer","hero.body":"Chọn hiện tượng đối chiếu, chỉnh count/risk và xem analysis sentence thay đổi.","mode.title":"Chọn phenomenon","control.count":"Example count","control.risk":"Mean risk","stat.category":"Phenomenon","stat.high":"High-risk examples","stat.priority":"Priority","writing.title":"Analysis sentence","viz.aria":"Minh họa priority","sentence.current":"Current priority = {n} x {risk} = {priority}.","sentence.result_complement":"Result complements need explicit action-vs-result contrast because Vietnamese often uses separate result words such as xong, thấy, được, or rõ.","sentence.sino_vietnamese_lexical":"Sino-Vietnamese lexical examples can help recognition, but false friends and register differences require source checking.","sentence.aspect_marker":"Aspect markers should be taught through context, not as a direct tense translation between 了, đã, and rồi.","sentence.measure_classifier":"Measure/classifier examples work best as noun chunks, because some Vietnamese renderings omit or change the classifier.","sentence.time_place_order":"Time/place order examples help learners see that Chinese often places adverbials before the verb phrase.","sentence.tone_pinyin_mapping":"Tone/pinyin examples show that Vietnamese tone knowledge is useful background, not a direct map to Mandarin tones."},"en":{"meta.title":"Week 09: Contrastive Risk Demo","nav.aria":"Course navigation","nav.home":"Home","nav.week":"Week 09","nav.slides":"Slides","nav.notebook":"Notebook","nav.language":"Language","hero.tag":"Interactive demo","hero.title":"Contrastive risk explorer","hero.body":"Choose a contrastive phenomenon, adjust count/risk, and watch the analysis sentence change.","mode.title":"Choose phenomenon","control.count":"Example count","control.risk":"Mean risk","stat.category":"Phenomenon","stat.high":"High-risk examples","stat.priority":"Priority","writing.title":"Analysis sentence","viz.aria":"Priority visualization","sentence.current":"Current priority = {n} x {risk} = {priority}.","sentence.result_complement":"Result complements need explicit action-vs-result contrast because Vietnamese often uses separate result words such as xong, thấy, được, or rõ.","sentence.sino_vietnamese_lexical":"Sino-Vietnamese lexical examples can help recognition, but false friends and register differences require source checking.","sentence.aspect_marker":"Aspect markers should be taught through context, not as a direct tense translation between 了, đã, and rồi.","sentence.measure_classifier":"Measure/classifier examples work best as noun chunks, because some Vietnamese renderings omit or change the classifier.","sentence.time_place_order":"Time/place order examples help learners see that Chinese often places adverbials before the verb phrase.","sentence.tone_pinyin_mapping":"Tone/pinyin examples show that Vietnamese tone knowledge is useful background, not a direct map to Mandarin tones."}};const categoryData={"result_complement":{"n":11,"risk":2.55,"high":6,"color":"#b8325f","zh":"我找到票了。","vi":"Tôi tìm thấy vé rồi."},"aspect_marker":{"n":10,"risk":2.5,"high":6,"color":"#6d5bd0","zh":"我吃饭了。","vi":"Tôi ăn cơm rồi."},"sino_vietnamese_lexical":{"n":11,"risk":2.18,"high":4,"color":"#b45309","zh":"先生","vi":"ông / thầy / anh"},"tone_pinyin_mapping":{"n":9,"risk":2.44,"high":4,"color":"#334155","zh":"买 / 卖","vi":"mua / bán"},"time_place_order":{"n":9,"risk":2.33,"high":4,"color":"#2563eb","zh":"我在学校学习汉语。","vi":"Tôi học tiếng Trung ở trường."},"measure_classifier":{"n":10,"risk":1.9,"high":2,"color":"#1f7a4d","zh":"一张票","vi":"một vé / một tấm vé"}};let mode='result_complement';const count=document.querySelector('#countSlider'),risk=document.querySelector('#riskSlider'),countVal=document.querySelector('#countValue'),riskVal=document.querySelector('#riskValue'),categoryStat=document.querySelector('#categoryStat'),highStat=document.querySelector('#highStat'),priorityStat=document.querySelector('#priorityStat'),zhExample=document.querySelector('#zhExample'),viExample=document.querySelector('#viExample'),sentence=document.querySelector('#sentence'),viz=document.querySelector('#viz'),buttons=Array.from(document.querySelectorAll('[data-mode]'));function t(k){const lang=window.Bilingual.getLang?window.Bilingual.getLang():'vi';return DEMO_I18N[lang][k]||DEMO_I18N.vi[k]||k}function setMode(next){mode=next;const item=categoryData[mode];count.value=item.n;risk.value=item.risk;buttons.forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});update();}function update(){const item=categoryData[mode];const n=Number(count.value),r=Number(risk.value),priority=(n*r).toFixed(1),now=t('sentence.current').replace('{n}',n).replace('{risk}',r.toFixed(2)).replace('{priority}',priority);countVal.textContent=n;riskVal.textContent=r.toFixed(2);categoryStat.textContent=mode;highStat.textContent=item.high;priorityStat.textContent=priority;zhExample.textContent=item.zh;viExample.textContent=item.vi;sentence.textContent=t('sentence.'+mode)+' '+now;const rows=[[mode,n,item.color],[t('control.risk'),Math.round(r/3*16),'#6d5bd0']];viz.innerHTML=rows.map(([label,value,color])=>`<div class="bar-row"><div>${label}</div><div class="bar-track"><span class="bar-fill" style="width:${Math.min(100,value*6)}%;background:${color}"></span><span class="bar-score">${value}</span></div></div>`).join('');}buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));[count,risk].forEach(i=>i.addEventListener('input',update));document.addEventListener('bilingual:change',update);window.Bilingual.init({translations:DEMO_I18N,defaultLang:'vi'});setMode(mode);</script></body></html>
