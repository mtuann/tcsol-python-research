<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">Tuần 10: Demo lesson adaptation</title>
  <link rel="stylesheet" href="../../assets/css/bilingual.css">
  <link rel="stylesheet" href="../../assets/css/course-doc.css">
  <style>
    body{background:#f6f8fc;color:#172033}
    main{max-width:1180px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2rem) 2rem}
    .topbar{align-items:center;background:rgba(255,255,255,.96);border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}
    .nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}
    .nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}
    .nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}
    .hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.35rem 0}
    .tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}
    .workspace{display:grid;gap:1rem;grid-template-columns:360px minmax(0,1fr)}
    .panel,.writing-box{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}
    .mode-row button{text-align:left;width:100%}
    .slug{display:block;color:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;margin-top:.2rem}
    .stats-grid{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:1rem}
    .stat{border-left:7px solid #2f63ea;background:#f8fbff;border-radius:8px;padding:.9rem;overflow-wrap:anywhere}
    .stat strong{display:block;font-size:clamp(1.2rem,2vw,1.8rem)}
    .timeline{display:grid;gap:.55rem}
    .timeline h2{font-size:1.05rem;margin:0}
    .timeline-row{align-items:center;display:grid;gap:.7rem;grid-template-columns:150px minmax(0,1fr) 52px}
    .track{background:#eef4ff;border-radius:999px;height:1.7rem;overflow:hidden}
    .fill{background:#1f7a4d;display:block;height:100%}
    .writing-box{border-left:7px solid #b8325f;margin-top:1rem}
    @media(max-width:820px){.workspace{grid-template-columns:1fr}.results{order:1}.selector{order:2}.stats-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;gap:.7rem;position:static}.timeline-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria">
      <a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a>
      <a href="./" data-i18n="nav.week">Tuần 10</a>
      <a href="slides.html" data-i18n="nav.slides">Slides</a>
      <a href="live_coding.html" data-i18n="nav.notebook">Notebook</a>
    </nav>
    <div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language">
      <button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button>
      <button type="button" data-lang-option="en" aria-pressed="false">English</button>
    </div>
  </header>
  <main>
    <section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">Bộ dựng thích ứng sư phạm</h1><p data-i18n="hero.body">Chọn một activity để xem phase, minutes, learner output và câu viết hàm ý sư phạm.</p></section>
    <section class="workspace">
      <aside class="panel selector"><p data-i18n="list.title">Chuỗi activity của model lesson</p><div class="mode-row" id="activityButtons"></div></aside>
      <section class="panel results"><div class="stats-grid"><div class="stat"><strong id="phaseStat"></strong><span data-i18n="stat.phase">Giai đoạn</span></div><div class="stat"><strong id="minuteStat"></strong><span data-i18n="stat.minutes">Phút</span></div><div class="stat"><strong id="scoreStat"></strong><span data-i18n="stat.score">Score</span></div></div><div class="timeline" id="timeline"></div><div class="writing-box"><strong data-i18n="writing.title">Câu implication</strong><p id="sentence"></p></div></section>
    </section>
  </main>
  <script src="../../assets/js/bilingual.js"></script>
  <script>
    const DEMO_I18N = {"vi": {"meta.title": "Tuần 10: Demo lesson adaptation", "nav.aria": "Điều hướng khóa học", "nav.home": "Trang chủ", "nav.week": "Tuần 10", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Ngôn ngữ / Language", "hero.tag": "Demo tương tác", "hero.title": "Bộ dựng thích ứng sư phạm", "hero.body": "Chọn một activity để xem phase, minutes, learner output và câu viết hàm ý sư phạm.", "list.title": "Chuỗi activity của model lesson", "stat.phase": "Giai đoạn", "stat.minutes": "Phút", "stat.score": "Score", "timeline.title": "Nhịp độ 45 phút", "writing.title": "Câu implication", "sentence": "Activity {id} ({title}) thuộc giai đoạn {phase}, kéo dài {minutes} phút. Learner output là {output}. Activity này nên được mô tả như gợi ý thiết kế, không phải bằng chứng hiệu quả."}, "en": {"meta.title": "Week 10: Lesson Adaptation Demo", "nav.aria": "Course navigation", "nav.home": "Home", "nav.week": "Week 10", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Language", "hero.tag": "Interactive demo", "hero.title": "Lesson adaptation builder", "hero.body": "Choose an activity to see phase, minutes, learner output, and a pedagogical implication sentence.", "list.title": "Model lesson sequence", "stat.phase": "Phase", "stat.minutes": "Minutes", "stat.score": "Score", "timeline.title": "45-minute pacing", "writing.title": "Implication sentence", "sentence": "Activity {id} ({title}) belongs to the {phase} phase and lasts {minutes} minutes. The learner output is {output}. This activity should be described as a design recommendation, not proof of effectiveness."}};
    const PLAN = [{"id": "A025", "phase": "review", "phase_vi": "ôn lại", "phase_en": "review", "minutes": 4, "score": 32, "title_vi": "Mở bài ôn nhanh", "title_en": "Mini review opener", "output_vi": "một phân biệt nói miệng", "output_en": "one oral distinction"}, {"id": "A001", "phase": "notice", "phase_vi": "nhận diện", "phase_en": "notice", "minutes": 6, "score": 35, "title_vi": "Nhận diện hành động và kết quả", "title_en": "Notice action vs result", "output_vi": "một thẻ ví dụ đã đánh dấu", "output_en": "marked example card"}, {"id": "A002", "phase": "compare", "phase_vi": "đối chiếu", "phase_en": "compare", "minutes": 8, "score": 35, "title_vi": "Bảng đối chiếu nhỏ", "title_en": "Contrast mini-board", "output_vi": "một dòng đối chiếu hoàn chỉnh", "output_en": "one completed contrast row"}, {"id": "A003", "phase": "controlled_practice", "phase_vi": "luyện có kiểm soát", "phase_en": "controlled practice", "minutes": 10, "score": 34, "title_vi": "Điền khung câu", "title_en": "Frame completion drill", "output_vi": "sáu câu hoàn chỉnh", "output_en": "six completed sentences"}, {"id": "A004", "phase": "communicative_practice", "phase_vi": "luyện giao tiếp", "phase_en": "communicative practice", "minutes": 10, "score": 35, "title_vi": "Role play mất vé", "title_en": "Lost-ticket role play", "output_vi": "một hội thoại ngắn", "output_en": "mini dialogue"}, {"id": "A021", "phase": "feedback", "phase_vi": "phản hồi", "phase_en": "feedback", "minutes": 3, "score": 33, "title_vi": "Ngân hàng feedback của giáo viên", "title_en": "Teacher feedback bank", "output_vi": "một bộ câu feedback", "output_en": "feedback bank"}, {"id": "A005", "phase": "assessment", "phase_vi": "đánh giá nhanh", "phase_en": "assessment", "minutes": 4, "score": 35, "title_vi": "Exit ticket", "title_en": "Exit ticket", "output_vi": "một câu và một ghi chú", "output_en": "one sentence + note"}];
    let current = PLAN[0].id;
    const buttons = document.querySelector('#activityButtons');
    const phaseStat = document.querySelector('#phaseStat');
    const minuteStat = document.querySelector('#minuteStat');
    const scoreStat = document.querySelector('#scoreStat');
    const timeline = document.querySelector('#timeline');
    const sentence = document.querySelector('#sentence');
    function lang() { return window.Bilingual.getLang ? window.Bilingual.getLang() : 'vi'; }
    function tr(k) { const l = lang(); return DEMO_I18N[l][k] || DEMO_I18N.vi[k] || k; }
    function label(row, key) { const l = lang(); return row[key + '_' + l] || row[key + '_en'] || row[key] || ''; }
    function renderButtons() {
      buttons.innerHTML = PLAN.map(row => '<button type="button" data-id="' + row.id + '">' + label(row, 'title') + '<span class="slug">' + label(row, 'phase') + ' · ' + row.minutes + ' min</span></button>').join('');
      buttons.querySelectorAll('button').forEach(button => button.addEventListener('click', () => setCurrent(button.dataset.id)));
    }
    function setCurrent(id) { current = id; buttons.querySelectorAll('button').forEach(button => button.classList.toggle('active', button.dataset.id === id)); update(); }
    function update() {
      const row = PLAN.find(item => item.id === current);
      phaseStat.textContent = label(row, 'phase');
      minuteStat.textContent = row.minutes;
      scoreStat.textContent = row.score;
      timeline.innerHTML = '<h2 data-i18n="timeline.title">' + tr('timeline.title') + '</h2>' + PLAN.map(item => '<div class="timeline-row"><strong>' + label(item, 'phase') + '</strong><div class="track"><span class="fill" style="width:' + Math.max(12, item.minutes / 10 * 100) + '%"></span></div><span>' + item.minutes + 'm</span></div>').join('');
      sentence.textContent = tr('sentence').replace('{id}', row.id).replace('{title}', label(row, 'title')).replace('{phase}', label(row, 'phase')).replace('{minutes}', row.minutes).replace('{output}', label(row, 'output'));
    }
    document.addEventListener('bilingual:change', () => { renderButtons(); setCurrent(current); });
    window.Bilingual.init({ translations: DEMO_I18N, defaultLang: 'vi' });
    renderButtons();
    setCurrent(current);
  </script>
</body>
</html>
