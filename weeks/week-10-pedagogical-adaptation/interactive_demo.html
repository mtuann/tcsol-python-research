<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 10: Lesson Plan Demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><link rel="stylesheet" href="../../assets/css/course-doc.css"><style>body{background:#f6f8fc;color:#172033}main{max-width:1180px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2rem) 2rem}.topbar{align-items:center;background:rgba(255,255,255,.96);border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}.nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}.nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}.nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.35rem 0}.tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}.workspace{display:grid;gap:1rem;grid-template-columns:380px minmax(0,1fr)}.panel,.writing-box{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}.mode-row button{text-align:left;width:100%}.slug{display:block;color:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;margin-top:.2rem}.stats-grid{display:grid;gap:.75rem;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:1rem}.stat{border-left:7px solid #2f63ea;background:#f8fbff;border-radius:8px;padding:.9rem;overflow-wrap:anywhere}.stat strong{display:block;font-size:clamp(1.2rem,2vw,1.8rem)}.timeline{display:grid;gap:.55rem}.timeline-row{align-items:center;display:grid;gap:.7rem;grid-template-columns:150px minmax(0,1fr) 52px}.track{background:#eef4ff;border-radius:999px;height:1.7rem;overflow:hidden}.fill{background:#1f7a4d;display:block;height:100%}.writing-box{border-left:7px solid #b8325f;margin-top:1rem}@media(max-width:820px){.workspace,.stats-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;gap:.7rem}.timeline-row{grid-template-columns:1fr}}</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần 10</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">Lesson adaptation builder</h1><p data-i18n="hero.body">Chọn activity để xem phase, minutes, learner output và câu viết pedagogical implication.</p></section><section class="workspace"><aside class="panel"><p data-i18n="list.title">Model lesson sequence</p><div class="mode-row" id="activityButtons"></div></aside><section class="panel"><div class="stats-grid"><div class="stat"><strong id="phaseStat"></strong><span data-i18n="stat.phase">Phase</span></div><div class="stat"><strong id="minuteStat"></strong><span data-i18n="stat.minutes">Minutes</span></div><div class="stat"><strong id="scoreStat"></strong><span data-i18n="stat.score">Score</span></div></div><div class="timeline" id="timeline"></div><div class="writing-box"><strong data-i18n="writing.title">Câu implication</strong><p id="sentence"></p></div></section></section></main><script src="../../assets/js/bilingual.js"></script><script>const DEMO_I18N={"vi": {"meta.title": "Tuần 10: Lesson Plan Demo", "nav.aria": "Điều hướng khóa học", "nav.home": "Trang chủ", "nav.week": "Tuần 10", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Ngôn ngữ / Language", "hero.tag": "Demo tương tác", "hero.title": "Lesson adaptation builder", "hero.body": "Chọn activity để xem phase, minutes, learner output và câu viết pedagogical implication.", "list.title": "Model lesson sequence", "stat.phase": "Phase", "stat.minutes": "Minutes", "stat.score": "Score", "writing.title": "Câu implication", "sentence": "Activity {id} ({title}) thuộc phase {phase}, kéo dài {minutes} phút. Learner output là {output}. Activity này nên được mô tả như design recommendation, không phải bằng chứng hiệu quả."}, "en": {"meta.title": "Week 10: Lesson Plan Demo", "nav.aria": "Course navigation", "nav.home": "Home", "nav.week": "Week 10", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Language", "hero.tag": "Interactive demo", "hero.title": "Lesson adaptation builder", "hero.body": "Choose an activity to see phase, minutes, learner output, and a pedagogical implication sentence.", "list.title": "Model lesson sequence", "stat.phase": "Phase", "stat.minutes": "Minutes", "stat.score": "Score", "writing.title": "Implication sentence", "sentence": "Activity {id} ({title}) belongs to the {phase} phase and lasts {minutes} minutes. The learner output is {output}. This activity should be described as a design recommendation, not proof of effectiveness."}};const PLAN=[{"activity_id": "A025", "lesson_phase": "review", "minutes": 4, "activity_title": "Mini review opener", "target_form": "找 / 找到", "vietnamese_bridge": "tìm / tìm thấy", "teacher_move": "show old and new example", "learner_output": "one oral distinction", "assessment_evidence": "learner names action/result", "caution_note": "Review should be short."}, {"activity_id": "A001", "lesson_phase": "notice", "minutes": 6, "activity_title": "Notice action vs result", "target_form": "找 / 找到", "vietnamese_bridge": "tìm / tìm thấy", "teacher_move": "model two examples; ask learners to mark result words", "learner_output": "marked example card", "assessment_evidence": "learner highlights correct focus token", "caution_note": "Do not explain every complement type at once."}, {"activity_id": "A002", "lesson_phase": "compare", "minutes": 8, "activity_title": "Contrast mini-board", "target_form": "找到 / 找完 / 找错", "vietnamese_bridge": "tìm thấy / tìm xong / tìm nhầm", "teacher_move": "write Chinese pattern beside Vietnamese rendering", "learner_output": "one completed contrast row", "assessment_evidence": "oral explanation of one row", "caution_note": "Keep Vietnamese rendering as support, not final answer."}, {"activity_id": "A003", "lesson_phase": "controlled_practice", "minutes": 10, "activity_title": "Frame completion drill", "target_form": "V + 到 / 完 / 对", "vietnamese_bridge": "thấy / xong / đúng", "teacher_move": "give half-completed sentences and feedback", "learner_output": "six completed sentences", "assessment_evidence": "accuracy in completed frames", "caution_note": "Controlled practice should be brief and meaningful."}, {"activity_id": "A004", "lesson_phase": "communicative_practice", "minutes": 10, "activity_title": "Lost-ticket role play", "target_form": "找到票 / 买到票", "vietnamese_bridge": "tìm thấy vé / mua được vé", "teacher_move": "assign roles and require two target sentences", "learner_output": "mini dialogue", "assessment_evidence": "target forms in dialogue", "caution_note": "Do not grade fluency more than target form this week."}, {"activity_id": "A021", "lesson_phase": "feedback", "minutes": 3, "activity_title": "Teacher feedback bank", "target_form": "你找到了吗？", "vietnamese_bridge": "Bạn đã tìm thấy chưa?", "teacher_move": "prepare prompts", "learner_output": "feedback bank", "assessment_evidence": "feedback addresses target form", "caution_note": "Feedback should be specific and brief."}, {"activity_id": "A005", "lesson_phase": "assessment", "minutes": 4, "activity_title": "Exit ticket", "target_form": "找到 / 找", "vietnamese_bridge": "tìm thấy / tìm", "teacher_move": "collect one sentence plus one explanation", "learner_output": "one sentence + note", "assessment_evidence": "teacher reads for action/result distinction", "caution_note": "Exit ticket is formative, not a test score."}];const PRIORITY=[{"activity_id": "A001", "phenomenon": "result_complement", "activity_title": "Notice action vs result", "lesson_phase": "notice", "minutes": 6, "adaptation_score": 35.0, "activity_goal": "identify action-result difference"}, {"activity_id": "A002", "phenomenon": "result_complement", "activity_title": "Contrast mini-board", "lesson_phase": "compare", "minutes": 8, "adaptation_score": 35.0, "activity_goal": "compare Chinese result complement with Vietnamese result wording"}, {"activity_id": "A004", "phenomenon": "result_complement", "activity_title": "Lost-ticket role play", "lesson_phase": "communicative_practice", "minutes": 10, "adaptation_score": 35.0, "activity_goal": "use result complements in a tiny communicative task"}, {"activity_id": "A005", "phenomenon": "result_complement", "activity_title": "Exit ticket", "lesson_phase": "assessment", "minutes": 4, "adaptation_score": 35.0, "activity_goal": "check whether learner separates action and result"}, {"activity_id": "A003", "phenomenon": "result_complement", "activity_title": "Frame completion drill", "lesson_phase": "controlled_practice", "minutes": 10, "adaptation_score": 34.0, "activity_goal": "produce controlled result-complement frames"}, {"activity_id": "A021", "phenomenon": "result_complement", "activity_title": "Teacher feedback bank", "lesson_phase": "feedback", "minutes": 3, "adaptation_score": 33.0, "activity_goal": "give corrective feedback without long lecture"}, {"activity_id": "A025", "phenomenon": "result_complement", "activity_title": "Mini review opener", "lesson_phase": "review", "minutes": 4, "adaptation_score": 32.0, "activity_goal": "activate prior contrast before practice"}, {"activity_id": "A022", "phenomenon": "aspect_marker", "activity_title": "Before-after picture prompt", "lesson_phase": "communicative_practice", "minutes": 10, "adaptation_score": 32.0, "activity_goal": "use aspect marker with visible context"}];let current=PLAN[0].activity_id;const buttons=document.querySelector('#activityButtons'),phaseStat=document.querySelector('#phaseStat'),minuteStat=document.querySelector('#minuteStat'),scoreStat=document.querySelector('#scoreStat'),timeline=document.querySelector('#timeline'),sentence=document.querySelector('#sentence');function t(k){const lang=window.Bilingual.getLang?window.Bilingual.getLang():'vi';return DEMO_I18N[lang][k]||DEMO_I18N.vi[k]||k}function score(id){const row=PRIORITY.find(r=>r.activity_id===id);return row?row.adaptation_score:'-'}function renderButtons(){buttons.innerHTML=PLAN.map(r=>`<button type="button" data-id="${r.activity_id}">${r.activity_title}<span class="slug">${r.lesson_phase} · ${r.minutes} min</span></button>`).join('');buttons.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setCurrent(b.dataset.id)));}function setCurrent(id){current=id;buttons.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));update();}function update(){const row=PLAN.find(r=>r.activity_id===current);phaseStat.textContent=row.lesson_phase;minuteStat.textContent=row.minutes;scoreStat.textContent=score(row.activity_id);timeline.innerHTML=PLAN.map(r=>`<div class="timeline-row"><strong>${r.lesson_phase}</strong><div class="track"><span class="fill" style="width:${Math.max(12,r.minutes/10*100)}%"></span></div><span>${r.minutes}m</span></div>`).join('');sentence.textContent=t('sentence').replace('{id}',row.activity_id).replace('{title}',row.activity_title).replace('{phase}',row.lesson_phase).replace('{minutes}',row.minutes).replace('{output}',row.learner_output);}document.addEventListener('bilingual:change',update);window.Bilingual.init({translations:DEMO_I18N,defaultLang:'vi'});renderButtons();setCurrent(current);</script></body></html>
