<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 11: MT demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><link rel="stylesheet" href="../../assets/css/course-doc.css"><style>body{background:#f6f8fc;color:#172033}main{max-width:1120px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2rem)}.topbar{align-items:center;background:#fff;border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}.nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}.nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}.nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.35rem 0}.tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}.workspace{display:grid;gap:1rem;grid-template-columns:300px minmax(0,1fr)}.panel,.writing-box{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}.mode-row button{width:100%;text-align:left}.stats-grid{display:grid;gap:.75rem;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:1rem}.stat{border-left:7px solid #2f63ea;background:#f8fbff;border-radius:8px;padding:.9rem}.stat strong{display:block;font-size:clamp(1.2rem,2vw,1.8rem)}.bar-row{display:grid;gap:.5rem;grid-template-columns:170px 1fr 44px;align-items:center;margin:.45rem 0}.bar{background:#eef4ff;border-radius:999px;height:1.4rem;overflow:hidden}.bar i{background:#1f7a4d;display:block;height:100%}.writing-box{border-left:7px solid #b8325f;margin-top:1rem}@media(max-width:820px){.workspace,.stats-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;position:static}.bar-row{grid-template-columns:1fr}}</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần 11</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">So sánh MT systems</h1><p data-i18n="hero.body">Chọn system để xem BLEU, chrF++, TER, human scores và error labels.</p></section><section class="workspace"><aside class="panel"><p data-i18n="list.title">MT systems</p><div class="mode-row" id="systemButtons"></div></aside><section class="panel"><div class="stats-grid"><div class="stat"><strong id="bleuStat"></strong><span data-i18n="stat.bleu">BLEU</span></div><div class="stat"><strong id="chrfStat"></strong><span data-i18n="stat.chrf">chrF++</span></div><div class="stat"><strong id="terStat"></strong><span data-i18n="stat.ter">TER</span></div><div class="stat"><strong id="humanStat"></strong><span data-i18n="stat.human">Human scores</span></div></div><h2 data-i18n="errors.title">Simplified error labels</h2><div id="errorBars"></div><div class="writing-box"><strong data-i18n="sentence.title">Câu Results</strong><p id="sentence"></p></div></section></section></main><script src="../../assets/js/bilingual.js"></script><script>const DEMO_I18N={"vi": {"meta.title": "Tuần 11: MT demo", "nav.aria": "Điều hướng khóa học", "nav.home": "Trang chủ", "nav.week": "Tuần 11", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Ngôn ngữ / Language", "hero.tag": "Demo tương tác", "hero.title": "So sánh MT systems", "hero.body": "Chọn system để xem BLEU, chrF++, TER, human scores và error labels.", "list.title": "MT systems", "stat.bleu": "BLEU", "stat.chrf": "chrF++", "stat.ter": "TER", "stat.human": "Human scores", "errors.title": "Simplified error labels", "sentence.title": "Câu Results", "sentence": "{system} có chrF++ = {chrf} và TER = {ter}. Human adequacy trung bình là {adequacy}. Kết quả này cần đọc cùng error labels, không nên xem metric là bằng chứng duy nhất."}, "en": {"meta.title": "Week 11: MT demo", "nav.aria": "Course navigation", "nav.home": "Home", "nav.week": "Week 11", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Language", "hero.tag": "Interactive demo", "hero.title": "Compare MT systems", "hero.body": "Choose a system to see BLEU, chrF++, TER, human scores, and error labels.", "list.title": "MT systems", "stat.bleu": "BLEU", "stat.chrf": "chrF++", "stat.ter": "TER", "stat.human": "Human scores", "errors.title": "Simplified error labels", "sentence.title": "Results sentence", "sentence": "{system} has chrF++ = {chrf} and TER = {ter}. Mean human adequacy is {adequacy}. Read this result with error labels; do not treat metrics as the only evidence."}};const METRICS=[{"mt_system": "MT_B_fluent", "segments": 12, "bleu": 63.47, "chrf_pp": 77.94, "ter": 23.04, "mean_adequacy": 4.39, "mean_fluency": 4.19, "major_or_minor_errors": 10}, {"mt_system": "MT_A_literal", "segments": 12, "bleu": 34.72, "chrf_pp": 55.82, "ter": 47.06, "mean_adequacy": 2.55, "mean_fluency": 2.25, "major_or_minor_errors": 12}, {"mt_system": "MT_C_omission", "segments": 12, "bleu": 32.96, "chrf_pp": 53.29, "ter": 49.02, "mean_adequacy": 3.08, "mean_fluency": 3.28, "major_or_minor_errors": 12}];const ERRORS=[{"mt_system": "MT_A_literal", "simplified_error_label": "terminology_or_word_order", "segment_count": 12}, {"mt_system": "MT_B_fluent", "simplified_error_label": "minor_style", "segment_count": 10}, {"mt_system": "MT_B_fluent", "simplified_error_label": "acceptable_variant", "segment_count": 2}, {"mt_system": "MT_C_omission", "simplified_error_label": "omission", "segment_count": 12}];let current=METRICS[0].mt_system;const buttons=document.querySelector('#systemButtons');function lang(){return window.Bilingual.getLang?window.Bilingual.getLang():'vi'}function tr(k){const l=lang();return DEMO_I18N[l][k]||DEMO_I18N.vi[k]||k}function renderButtons(){buttons.innerHTML=METRICS.map(r=>'<button type="button" data-system="'+r.mt_system+'">'+r.mt_system+'</button>').join('');buttons.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setCurrent(b.dataset.system)));}function setCurrent(system){current=system;buttons.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.system===system));update();}function update(){const row=METRICS.find(r=>r.mt_system===current);document.querySelector('#bleuStat').textContent=row.bleu;document.querySelector('#chrfStat').textContent=row.chrf_pp;document.querySelector('#terStat').textContent=row.ter;document.querySelector('#humanStat').textContent=row.mean_adequacy+' / '+row.mean_fluency;const errs=ERRORS.filter(e=>e.mt_system===current);const max=Math.max(...errs.map(e=>e.segment_count),1);document.querySelector('#errorBars').innerHTML=errs.map(e=>'<div class="bar-row"><strong>'+e.simplified_error_label+'</strong><div class="bar"><i style="width:'+(e.segment_count/max*100)+'%"></i></div><span>'+e.segment_count+'</span></div>').join('');document.querySelector('#sentence').textContent=tr('sentence').replace('{system}',row.mt_system).replace('{chrf}',row.chrf_pp).replace('{ter}',row.ter).replace('{adequacy}',row.mean_adequacy);}document.addEventListener('bilingual:change',update);window.Bilingual.init({translations:DEMO_I18N,defaultLang:'vi'});renderButtons();setCurrent(current);</script></body></html>
