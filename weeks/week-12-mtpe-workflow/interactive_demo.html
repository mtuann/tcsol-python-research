<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 12: MTPE demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><link rel="stylesheet" href="../../assets/css/course-doc.css"><style>body{background:#f6f8fc;color:#172033}main{max-width:1120px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2rem)}.topbar{align-items:center;background:#fff;border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}.nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}.nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}.nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.35rem 0}.tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}.workspace{display:grid;gap:1rem;grid-template-columns:300px minmax(0,1fr)}.panel,.writing-box{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}.mode-row button{width:100%;text-align:left}.stats-grid{display:grid;gap:.75rem;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:1rem}.stat{border-left:7px solid #1f7a4d;background:#f8fbff;border-radius:8px;padding:.9rem}.stat strong{display:block;font-size:clamp(1.2rem,2vw,1.8rem)}.bar-row{display:grid;gap:.5rem;grid-template-columns:170px 1fr 44px;align-items:center;margin:.45rem 0}.bar{background:#eef4ff;border-radius:999px;height:1.4rem;overflow:hidden}.bar i{background:#2f63ea;display:block;height:100%}.writing-box{border-left:7px solid #b8325f;margin-top:1rem}@media(max-width:820px){.workspace,.stats-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;position:static}.bar-row{grid-template-columns:1fr}}</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần 12</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">So sánh MTPE effort</h1><p data-i18n="hero.body">Chọn profile để xem time, edit distance và revision types.</p></section><section class="workspace"><aside class="panel"><p data-i18n="list.title">MT profiles</p><div class="mode-row" id="systemButtons"></div></aside><section class="panel"><div class="stats-grid"><div class="stat"><strong id="timeStat"></strong><span data-i18n="stat.time">Mean time</span></div><div class="stat"><strong id="editStat"></strong><span data-i18n="stat.edit">Edit distance</span></div><div class="stat"><strong id="revisionStat"></strong><span data-i18n="stat.rows">Revision rows</span></div><div class="stat"><strong id="segmentStat"></strong><span data-i18n="stat.segments">Segments</span></div></div><h2 data-i18n="revision.title">Revision types</h2><div id="revisionBars"></div><div class="writing-box"><strong data-i18n="sentence.title">Câu Results</strong><p id="sentence"></p></div></section></section></main><script src="../../assets/js/bilingual.js"></script><script>const DEMO_I18N={"vi": {"meta.title": "Tuần 12: MTPE demo", "nav.aria": "Điều hướng khóa học", "nav.home": "Trang chủ", "nav.week": "Tuần 12", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Ngôn ngữ / Language", "hero.tag": "Demo tương tác", "hero.title": "So sánh MTPE effort", "hero.body": "Chọn profile để xem time, edit distance và revision types.", "list.title": "MT profiles", "stat.time": "Mean time", "stat.edit": "Edit distance", "stat.rows": "Revision rows", "stat.segments": "Segments", "revision.title": "Revision types", "sentence.title": "Câu Results", "sentence": "{system} có mean post-editing time = {time}s và normalized edit distance = {edit}. Đọc số này cùng revision types; edit distance chỉ là proxy bề mặt.", "no_error": "không lỗi", "style": "style", "terminology": "terminology", "word_order": "word order", "omission": "omission"}, "en": {"meta.title": "Week 12: MTPE demo", "nav.aria": "Course navigation", "nav.home": "Home", "nav.week": "Week 12", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Language", "hero.tag": "Interactive demo", "hero.title": "Compare MTPE effort", "hero.body": "Choose a profile to see time, edit distance, and revision types.", "list.title": "MT profiles", "stat.time": "Mean time", "stat.edit": "Edit distance", "stat.rows": "Revision rows", "stat.segments": "Segments", "revision.title": "Revision types", "sentence.title": "Results sentence", "sentence": "{system} has mean post-editing time = {time}s and normalized edit distance = {edit}. Read this with revision types; edit distance is only a surface proxy.", "no_error": "no error", "style": "style", "terminology": "terminology", "word_order": "word order", "omission": "omission"}};const EFFORTS=[{"mt_system": "MT_B", "segments": 10, "mean_pe_time_seconds": 36.4, "median_pe_time_seconds": 35.0, "mean_char_edit_distance": 13.5, "mean_normalized_edit_distance": 0.16, "revision_needed_rows": 5}, {"mt_system": "MT_A", "segments": 10, "mean_pe_time_seconds": 99.4, "median_pe_time_seconds": 101.5, "mean_char_edit_distance": 33.9, "mean_normalized_edit_distance": 0.41, "revision_needed_rows": 10}, {"mt_system": "MT_C", "segments": 10, "mean_pe_time_seconds": 111.4, "median_pe_time_seconds": 117.5, "mean_char_edit_distance": 32.9, "mean_normalized_edit_distance": 0.4, "revision_needed_rows": 10}];const REVISIONS=[{"mt_system": "MT_A", "revision_type": "terminology", "segment_count": 6}, {"mt_system": "MT_A", "revision_type": "style", "segment_count": 2}, {"mt_system": "MT_A", "revision_type": "word_order", "segment_count": 2}, {"mt_system": "MT_B", "revision_type": "no_error", "segment_count": 5}, {"mt_system": "MT_B", "revision_type": "style", "segment_count": 5}, {"mt_system": "MT_C", "revision_type": "omission", "segment_count": 10}];let current=EFFORTS[0].mt_system;const buttons=document.querySelector('#systemButtons');function lang(){return window.Bilingual.getLang?window.Bilingual.getLang():'vi'}function tr(k){const l=lang();return DEMO_I18N[l][k]||DEMO_I18N.vi[k]||k}function labelType(v){return tr(v)||v}function renderButtons(){buttons.innerHTML=EFFORTS.map(r=>'<button type="button" data-system="'+r.mt_system+'">'+r.mt_system+'</button>').join('');buttons.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setCurrent(b.dataset.system)));}function setCurrent(system){current=system;buttons.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.system===system));update();}function update(){const row=EFFORTS.find(r=>r.mt_system===current);document.querySelector('#timeStat').textContent=row.mean_pe_time_seconds+'s';document.querySelector('#editStat').textContent=row.mean_normalized_edit_distance;document.querySelector('#revisionStat').textContent=row.revision_needed_rows;document.querySelector('#segmentStat').textContent=row.segments;const rows=REVISIONS.filter(e=>e.mt_system===current);const max=Math.max(...rows.map(e=>e.segment_count),1);document.querySelector('#revisionBars').innerHTML=rows.map(e=>'<div class="bar-row"><strong>'+labelType(e.revision_type)+'</strong><div class="bar"><i style="width:'+(e.segment_count/max*100)+'%"></i></div><span>'+e.segment_count+'</span></div>').join('');document.querySelector('#sentence').textContent=tr('sentence').replace('{system}',row.mt_system).replace('{time}',row.mean_pe_time_seconds).replace('{edit}',row.mean_normalized_edit_distance);}window.addEventListener('bilingual:change',update);window.Bilingual.init({translations:DEMO_I18N,defaultLang:'vi',onChange:update});renderButtons();setCurrent(current);</script></body></html>
