<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="meta.title">Tuần 13: Policy coding demo</title><link rel="stylesheet" href="../../assets/css/bilingual.css"><link rel="stylesheet" href="../../assets/css/course-doc.css"><style>body{background:#f6f8fc;color:#172033}main{max-width:1120px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2rem)}.topbar{align-items:center;background:#fff;border-bottom:1px solid #d8e2f0;display:flex;justify-content:space-between;padding:.75rem clamp(1rem,3vw,2rem);position:sticky;top:0;z-index:5}.nav-links,.mode-row{display:flex;flex-wrap:wrap;gap:.5rem}.nav-links a,.mode-row button{background:#fff;border:1px solid #d8e2f0;border-radius:8px;color:#172033;font-weight:800;padding:.55rem .8rem;text-decoration:none}.nav-links a.primary,.mode-row button.active{background:#2f63ea;color:#fff}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:.35rem 0}.tag{background:#fff;border:1px solid #d8e2f0;border-radius:999px;color:#2f63ea;display:inline-block;font-weight:900;letter-spacing:.06em;padding:.35rem .75rem;text-transform:uppercase}.panel{background:#fff;border:1px solid #d8e2f0;border-radius:8px;box-shadow:0 14px 34px rgba(23,32,51,.08);padding:1rem}.workspace{display:grid;gap:1rem;grid-template-columns:300px minmax(0,1fr)}.bar-row{display:grid;gap:.5rem;grid-template-columns:minmax(150px,240px) 1fr 44px;align-items:center;margin:.55rem 0}.bar{background:#eef4ff;border-radius:999px;height:1.35rem;overflow:hidden}.bar i{background:#1f7a4d;display:block;height:100%}.stats{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:1rem}.stat{border-left:7px solid #2f63ea;background:#f8fbff;border-radius:8px;padding:.9rem}.stat strong{display:block;font-size:clamp(1.4rem,2vw,2rem)}.writing-box{border-left:7px solid #b8325f;background:#fff;border-radius:8px;margin-top:1rem;padding:1rem}@media(max-width:820px){.workspace,.stats{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column;position:static}.bar-row{grid-template-columns:1fr}}</style></head><body><header class="topbar"><nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria"><a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a><a href="./" data-i18n="nav.week">Tuần 13</a><a href="slides.html" data-i18n="nav.slides">Slides</a><a href="live_coding.html" data-i18n="nav.notebook">Notebook</a></nav><div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language"><button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button><button type="button" data-lang-option="en" aria-pressed="false">English</button></div></header><main><section class="hero"><span class="tag" data-i18n="hero.tag">Demo tương tác</span><h1 data-i18n="hero.title">Đọc coding table</h1><p data-i18n="hero.body">Chọn view để xem policy_area hoặc source_type counts.</p></section><section class="workspace"><aside class="panel"><div class="mode-row"><button type="button" data-mode="area" aria-pressed="true" data-i18n="mode.area">Policy area</button><button type="button" data-mode="source" aria-pressed="false" data-i18n="mode.source">Source type</button></div></aside><section class="panel" aria-live="polite"><div class="stats"><div class="stat"><strong id="rowStat">12</strong><span data-i18n="stat.rows">Rows</span></div><div class="stat"><strong id="topStat"></strong><span data-i18n="stat.top">Top category</span></div></div><div id="bars"></div><div class="writing-box"><p id="sentence" aria-live="polite"></p></div></section></section></main><script src="../../assets/js/bilingual.js"></script><script>const DEMO_I18N={"vi": {"meta.title": "Tuần 13: Policy coding demo", "nav.aria": "Điều hướng khóa học", "nav.home": "Trang chủ", "nav.week": "Tuần 13", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Ngôn ngữ / Language", "hero.tag": "Demo tương tác", "hero.title": "Đọc coding table", "hero.body": "Chọn view để xem policy_area hoặc source_type counts.", "mode.area": "Policy area", "mode.source": "Source type", "stat.rows": "Rows", "stat.top": "Top category", "sentence.area": "Policy-area view cho thấy category đứng đầu là {label} với {count} rows. Đây là mô tả source set, không phải đánh giá impact.", "sentence.source": "Source-type view cho thấy category đứng đầu là {label} với {count} rows. Hãy đọc evidence type trước khi viết claim."}, "en": {"meta.title": "Week 13: Policy coding demo", "nav.aria": "Course navigation", "nav.home": "Home", "nav.week": "Week 13", "nav.slides": "Slides", "nav.notebook": "Notebook", "nav.language": "Language", "hero.tag": "Interactive demo", "hero.title": "Read a coding table", "hero.body": "Choose a view to see policy_area or source_type counts.", "mode.area": "Policy area", "mode.source": "Source type", "stat.rows": "Rows", "stat.top": "Top category", "sentence.area": "The policy-area view shows {label} as the top category with {count} rows. This describes the source set, not impact.", "sentence.source": "The source-type view shows {label} as the top category with {count} rows. Read evidence type before writing a claim."}};const AREA=[{"label": "teacher_development", "count": 2}, {"label": "indicator_metadata", "count": 2}, {"label": "policy_coding_method", "count": 2}, {"label": "system_governance", "count": 1}, {"label": "digitalization", "count": 1}, {"label": "internationalization", "count": 1}, {"label": "education_statistics", "count": 1}, {"label": "equity_access", "count": 1}, {"label": "comparative_policy", "count": 1}];const SOURCE=[{"label": "policy_plan", "count": 4}, {"label": "statistical_bulletin", "count": 3}, {"label": "metadata_standard", "count": 1}, {"label": "data_portal", "count": 1}, {"label": "coding_model", "count": 1}, {"label": "policy_dashboard", "count": 1}, {"label": "comparative_report", "count": 1}];let current='area';function lang(){return window.Bilingual.getLang?window.Bilingual.getLang():'vi'}function tr(k){return DEMO_I18N[lang()][k]||DEMO_I18N.vi[k]||k}function data(){return current==='area'?AREA:SOURCE}function update(){document.querySelectorAll('[data-mode]').forEach(b=>{const active=b.dataset.mode===current;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false')});const rows=data();const max=Math.max(...rows.map(r=>r.count),1);document.querySelector('#topStat').textContent=rows[0].label;document.querySelector('#bars').innerHTML=rows.map(r=>'<div class="bar-row"><strong>'+r.label+'</strong><div class="bar"><i style="width:'+(r.count/max*100)+'%"></i></div><span>'+r.count+'</span></div>').join('');document.querySelector('#sentence').textContent=tr(current==='area'?'sentence.area':'sentence.source').replace('{label}',rows[0].label).replace('{count}',rows[0].count)}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.mode;update()}));window.addEventListener('bilingual:change',update);window.Bilingual.init({translations:DEMO_I18N,defaultLang:'vi',onChange:update});update();</script></body></html>
