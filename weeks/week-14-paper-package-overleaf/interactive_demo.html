<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">Tuần 14: Tool route demo</title>
  <link rel="stylesheet" href="../../assets/css/bilingual.css">
  <link rel="stylesheet" href="../../assets/css/course-doc.css?v=20260604a">
  <style>
    body {
      background: #f6f8fc;
      color: #172033;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.2rem clamp(1rem, 3vw, 2rem);
    }

    .topbar {
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #d8e2f0;
      display: flex;
      justify-content: space-between;
      padding: .75rem clamp(1rem, 3vw, 2rem);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .nav-links,
    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .nav-links a,
    .mode-row button {
      background: #fff;
      border: 1px solid #d8e2f0;
      border-radius: 8px;
      color: #172033;
      font-weight: 800;
      padding: .55rem .8rem;
      text-decoration: none;
    }

    .nav-links a.primary,
    .mode-row button.active {
      background: #2f63ea;
      color: #fff;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      margin: .35rem 0;
    }

    .tag {
      background: #fff;
      border: 1px solid #d8e2f0;
      border-radius: 999px;
      color: #2f63ea;
      display: inline-block;
      font-weight: 900;
      letter-spacing: 0;
      padding: .35rem .75rem;
      text-transform: uppercase;
    }

    .panel {
      background: #fff;
      border: 1px solid #d8e2f0;
      border-radius: 8px;
      box-shadow: 0 14px 34px rgba(23, 32, 51, .08);
      padding: 1rem;
    }

    .workspace {
      display: grid;
      gap: 1rem;
      grid-template-columns: 300px minmax(0, 1fr);
    }

    .bar-row {
      align-items: center;
      display: grid;
      gap: .5rem;
      grid-template-columns: minmax(150px, 260px) 1fr minmax(42px, max-content);
      margin: .55rem 0;
    }

    .bar {
      background: #eef4ff;
      border-radius: 999px;
      height: 1.35rem;
      overflow: hidden;
    }

    .bar i {
      background: #1f7a4d;
      display: block;
      height: 100%;
    }

    .summary {
      background: #fff;
      border-left: 7px solid #b8325f;
      border-radius: 8px;
      margin-top: 1rem;
      padding: 1rem;
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        position: static;
      }

      .bar-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav-links" aria-label="Điều hướng khóa học" data-i18n-aria-label="nav.aria">
      <a class="primary" href="../../" data-i18n="nav.home">Trang chủ</a>
      <a href="./" data-i18n="nav.week">Tuần 14</a>
      <a href="slides.html" data-i18n="nav.slides">Slides</a>
      <a href="live_coding.html" data-i18n="nav.notebook">Notebook</a>
    </nav>
    <div class="language-switcher" role="group" aria-label="Ngôn ngữ / Language" data-i18n-aria-label="nav.language">
      <button type="button" data-lang-option="vi" aria-pressed="true">Tiếng Việt</button>
      <button type="button" data-lang-option="en" aria-pressed="false">English</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <span class="tag" data-i18n="hero.tag">Demo tương tác</span>
      <h1 data-i18n="hero.title">Chọn writing route</h1>
      <p data-i18n="hero.body">So sánh Word + Zotero, Quarto và Overleaf theo nhu cầu nộp bài.</p>
    </section>

    <section class="workspace">
      <aside class="panel">
        <div class="mode-row">
          <button type="button" class="active" data-mode="word" aria-pressed="true" data-i18n="mode.word">Word + Zotero</button>
          <button type="button" data-mode="quarto" aria-pressed="false" data-i18n="mode.quarto">Quarto</button>
          <button type="button" data-mode="overleaf" aria-pressed="false" data-i18n="mode.overleaf">Overleaf</button>
        </div>
      </aside>

      <div class="panel">
        <div id="bars" role="list" aria-label="Danh sách kết quả" data-i18n-aria-label="bars.aria"></div>
        <div class="summary">
          <h2 data-i18n="summary.title">Gợi ý diễn giải</h2>
          <p id="guide"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="../../assets/js/bilingual.js"></script>
  <script>
    const I18N = {
      vi: {
        "meta.title": "Tuần 14: Tool route demo",
        "nav.aria": "Điều hướng khóa học",
        "nav.home": "Trang chủ",
        "nav.week": "Tuần 14",
        "nav.slides": "Slides",
        "nav.notebook": "Notebook",
        "nav.language": "Ngôn ngữ / Language",
        "hero.tag": "Demo tương tác",
        "hero.title": "Chọn writing route",
        "hero.body": "So sánh Word + Zotero, Quarto và Overleaf theo nhu cầu nộp bài.",
        "summary.title": "Gợi ý diễn giải",
        "bars.aria": "Danh sách kết quả",
        "mode.word": "Word + Zotero",
        "mode.quarto": "Quarto",
        "mode.overleaf": "Overleaf"
      },
      en: {
        "meta.title": "Week 14: Tool route demo",
        "nav.aria": "Course navigation",
        "nav.home": "Home",
        "nav.week": "Week 14",
        "nav.slides": "Slides",
        "nav.notebook": "Notebook",
        "nav.language": "Language",
        "hero.tag": "Interactive demo",
        "hero.title": "Choose a writing route",
        "hero.body": "Compare Word + Zotero, Quarto, and Overleaf based on the submission need.",
        "summary.title": "Interpretation guide",
        "bars.aria": "Result list",
        "mode.word": "Word + Zotero",
        "mode.quarto": "Quarto",
        "mode.overleaf": "Overleaf"
      }
    };

    const DATA = {
      word: {
        rows: [
          { label: { vi: "phù hợp với beginner", en: "best beginner fit" }, count: 3 },
          { label: { vi: "cú pháp mới", en: "new syntax" }, count: 1 },
          { label: { vi: "dễ quản lý trích dẫn", en: "citation ease" }, count: 3 },
          { label: { vi: "rủi ro format", en: "format risk" }, count: 1 }
        ],
        guide: {
          vi: "Default cho beginner: tập trung vào argument và Zotero citations.",
          en: "Default for a beginner: focus on argument and Zotero citations."
        }
      },
      quarto: {
        rows: [
          { label: { vi: "khả năng tái lập", en: "reproducibility" }, count: 3 },
          { label: { vi: "cú pháp mới", en: "new syntax" }, count: 3 },
          { label: { vi: "dễ quản lý trích dẫn", en: "citation ease" }, count: 2 },
          { label: { vi: "rủi ro format", en: "format risk" }, count: 2 }
        ],
        guide: {
          vi: "Dùng khi muốn code, prose, figures và citations trong một report.",
          en: "Use when code, prose, figures, and citations should stay in one report."
        }
      },
      overleaf: {
        rows: [
          { label: { vi: "cần template LaTeX", en: "template need" }, count: 3 },
          { label: { vi: "cú pháp mới", en: "new syntax" }, count: 3 },
          { label: { vi: "dễ quản lý trích dẫn", en: "citation ease" }, count: 2 },
          { label: { vi: "rủi ro format", en: "format risk" }, count: 3 }
        ],
        guide: {
          vi: "Chỉ dùng khi template/collaborator/journal cần LaTeX.",
          en: "Use only when a template, collaborator, or journal requires LaTeX."
        }
      }
    };

    let mode = "word";

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      const lang = window.Bilingual ? window.Bilingual.getLang() : "vi";
      const pack = DATA[mode];
      const max = Math.max(...pack.rows.map((row) => row.count));
      document.getElementById("bars").innerHTML = pack.rows.map((row) => {
        const label = row.label[lang] || row.label.en;
        const width = Math.max(8, row.count / max * 100);
        return `<div class="bar-row" role="listitem" aria-label="${escapeHtml(label)}: ${row.count}">
          <strong>${escapeHtml(label)}</strong>
          <div class="bar" aria-hidden="true"><i style="width:${width}%"></i></div>
          <span>${row.count}</span>
        </div>`;
      }).join("");
      document.getElementById("guide").textContent = pack.guide[lang];
    }

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((item) => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        render();
      });
    });

    window.Bilingual.init({ translations: I18N, defaultLang: "vi", onChange: render });
    render();
  </script>
</body>
</html>
